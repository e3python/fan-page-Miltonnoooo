<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Two Headings and a List</title>
    <style>
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; padding: 2rem; color: #111; }
        h1 { font-size: 2.25rem; margin: 0 0 0.5rem 0; }
        h2 { font-size: 1.25rem; margin: 0 0 0.75rem 0; color: #333; }
        ul { margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>Primary Heading</h1>
    <h2>Secondary Heading</h2>

    <p>Below is an example unordered list:</p>
    <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>
</body>
</html>
